# Plantilla de variante. Copiar como variants/<nombre>.conf y <nombre>.js
#
# CARPETA: nombre de la carpeta en <redmine>/themes/ (es el nombre del tema
#          que se ve en Administración). Solo minúsculas, números, - y _.
CARPETA=sostenido
# INCLUIR_MARCA: si|no. Con "no" el logo de SOSTENIDO no se incluye en el
#          resultado (y el crédito del pie no puede mostrarse).
INCLUIR_MARCA=si
# LOGO / LOGO_CABECERA_OSCURA (opcionales): imagen del logo de la organización,
#          dentro de variants/. Ver "Logo de un cliente" en el README.
# LOGO=logos/organizacion.png
# LOGO_CABECERA_OSCURA=logos/organizacion-oscuro.png
# PALETA_MARCA (opcional): colores de la organización como cuarta paleta
#          (va primera en el menú). Ver herramientas/marca.py para el formato.
# PALETA_MARCA=marcas/organizacion.json
